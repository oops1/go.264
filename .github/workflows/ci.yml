name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 40m -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -n 1

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test -count=1 -race -timeout 60m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then echo "$fmtout"; exit 1; fi
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

  cgo-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Assert no cgo imports
        run: |
          if grep -rn --include='*.go' -E '^\s*import\s+"C"|^\s*"C"$' .; then
            echo "cgo import found"; exit 1
          fi
      - name: Build with CGO disabled on all targets
        run: |
          for target in linux/amd64 linux/arm64 linux/386 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 js/wasm; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done
      - name: Build and test the pure Go fallback
        run: |
          go build -tags purego ./...
          go test -tags purego -count=1 -timeout 40m ./...

  hwaccel-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Assert no cgo imports in the backend modules
        run: |
          if grep -rn --include='*.go' -E '^\s*import\s+"C"|^\s*"C"$' hwaccel; then
            echo "cgo import found"; exit 1
          fi
      - name: Build and vet every backend module on several targets
        run: |
          for mod in $(find hwaccel -name go.mod | xargs -n1 dirname); do
            for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
              (cd "$mod" && GOOS=${target%/*} GOARCH=${target#*/} go build ./...) || exit 1
            done
            (cd "$mod" && go vet ./...) || exit 1
          done
      - name: Format and lint the backend modules
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          fmtout=$(gofmt -l hwaccel)
          if [ -n "$fmtout" ]; then echo "$fmtout"; exit 1; fi
          for mod in $(find hwaccel -name go.mod | xargs -n1 dirname); do
            (cd "$mod" && staticcheck ./...) || exit 1
          done
      - name: Run the tests that do not need an adapter
        run: |
          for mod in $(find hwaccel -name go.mod | xargs -n1 dirname); do
            (cd "$mod" && go test -count=1 ./...) || exit 1
          done

  asm-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Regenerate assembly
        run: go generate ./internal/simd/
      - name: Assert the committed assembly matches
        run: |
          if ! git diff --exit-code -- internal/simd; then
            echo "generated assembly is out of date, run go generate ./internal/simd/"
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              go test -run "$target" -fuzz "^$target$" -fuzztime=20s "$pkg" || exit 1
            done
          done

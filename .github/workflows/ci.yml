name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout 90m -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.txt | tail -n 1

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go test -count=1 -race -timeout 90m ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: gofmt
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then echo "$fmtout"; exit 1; fi
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck ./...

  cgo-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Assert no cgo imports
        run: |
          if grep -rn --include='*.go' -E '^\s*import\s+"C"|^\s*"C"$' .; then
            echo "cgo import found"; exit 1
          fi
      - name: Build with CGO disabled on all targets
        run: |
          for target in linux/amd64 linux/arm64 linux/386 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64 js/wasm; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
          done
      - name: Build and test the pure Go fallback
        run: |
          go build -tags purego ./...
          go test -tags purego -count=1 -timeout 90m ./...

  linux-backends:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Vet the backends on every 64-bit Linux target, with and without the switch
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go vet ./internal/hwaccel/... . || exit 1
            GOOS=linux GOARCH=$arch go vet -tags go264_nohwaccel . || exit 1
          done
      - name: Run the backend tests without cgo
        run: |
          go test -count=1 ./internal/hwaccel/...
          go test -count=1 -run 'Linux|Hardware|Backend|KeyFrame' .
          go test -count=1 -tags go264_nohwaccel -run 'Switch' .
      - name: The switch keeps a Linux binary static
        run: |
          mkdir linkprobe
          printf 'package main\n\nimport (\n\t"fmt"\n\n\tgo264 "github.com/oops1/go.264"\n)\n\nfunc main() { fmt.Println(go264.Backends()) }\n' > linkprobe/main.go
          go build -o with-backends ./linkprobe
          go build -tags go264_nohwaccel -o without-backends ./linkprobe
          file with-backends | tee /dev/stderr | grep -q 'dynamically linked'
          file without-backends | tee /dev/stderr | grep -q 'statically linked'
          test "$(./with-backends)" = "[cpu nvenc vaapi]"
          test "$(./without-backends)" = "[cpu]"

  asm-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Regenerate assembly
        run: go generate ./internal/simd/
      - name: Assert the committed assembly matches
        run: |
          if ! git diff --exit-code -- internal/simd; then
            echo "generated assembly is out of date, run go generate ./internal/simd/"
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for target in $(go test -list 'Fuzz.*' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              go test -run "$target" -fuzz "^$target$" -fuzztime=20s "$pkg" || exit 1
            done
          done
